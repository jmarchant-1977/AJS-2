<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJS - Consulta de Grupos y Pagos</title>
    <link rel="icon" href="./img/logo-ico.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/styles_popup.css">
    <style>
        .table-responsive { overflow-x: auto; }
        #tabla-grupos th { font-size: 0.85em; background-color: #f8f9fa; }
    </style>
</head>
<body class="transactions-theme">
    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo-image">
                    <img src="./img/logo.jpg" alt="Logo AJS" class="logo-img">
                </div>
                <h1>AJS - Control de Pagos por Grupo</h1>
                <div class="logo-colors">
                    <div class="color-box blue"></div>
                    <div class="color-box yellow"></div>
                    <div class="color-box white"></div>
                </div>
                <div>
                    <button onclick="logout()" class="submit-btn secondary" title="Cerrar Sesión">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
                <div>
                    <button class="submit-btn secondary" title="Menú Principal" onclick="window.location.href='menu.html'">
                        <i class="fas fa-home"></i>
                    </button>
                </div>
                <div>
                    <a class="submit-btn secondary" href="index.html">
                        <i class="fas fa-file-invoice"></i> Recibos
                    </a>
                </div>
                <div>
                    <a class="submit-btn secondary" href="estudiantes.html">
                        <i class="fas fa-users"></i> Estudiantes
                    </a>
                </div>
            </div>
        </header>

        <main>
            <section class="card filtros">
                <h2><i class="fas fa-filter"></i> Filtros de Reporte</h2>
                <div class="filter-container">
                    <div class="form-group">
                        <label for="periodo-filter">Periodo:</label>
                        <select id="periodo-filter" class="form-input">
                            <!-- Se cargará dinámicamente -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="grado-filter">Grado:</label>
                        <select id="grado-filter" class="form-input">
                            <option value="">Todos</option>
                            <option value="1ER N">1ER NIVEL</option>
                            <option value="2DO N">2DO NIVEL</option>
                            <option value="1ER G">1ER GRADO</option>
                            <option value="2DO G">2DO GRADO</option>
                            <option value="3ER G">3ER GRADO</option>
                            <option value="4TO G">4TO GRADO</option>
                            <option value="5TO G">5TO GRADO</option>
                            <option value="6TO G">6TO GRADO</option>
                            <option value="1ER A">1ER AÑO</option>
                            <option value="2DO A">2DO AÑO</option>
                            <option value="3ER A">3ER AÑO</option>
                            <option value="4TO A">4TO AÑO</option>
                            <option value="5TO A">5TO AÑO</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="seccion-filter">Sección:</label>
                        <select id="seccion-filter" class="form-input">
                            <option value="">Todas</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                        </select>
                    </div>
                    <button id="btn-filtrar" class="submit-btn">
                        <i class="fas fa-sync"></i> Cargar Datos
                    </button>
                </div>
            </section>

            <section class="card resultados">
                <div class="resultados-header">
                    <h2><i class="fas fa-table"></i> Consolidado de Pagos</h2>
                    <button id="btn-exportar" class="submit-btn excel">
                        <i class="fas fa-file-excel"></i> Exportar Excel
                    </button>
                </div>
                <div class="table-responsive">
                    <table id="tabla-grupos" class="display nowrap" style="width:100%">
                        <thead>
                            <tr>
                                <th>Estudiante</th>
                                <th>Cédula</th>
                                <th>Grado</th>
                                <th>Secc.</th>
                                <th>INS</th>
                                <th>SEP</th>
                                <th>OCT</th>
                                <th>NOV</th>
                                <th>DIC</th>
                                <th>ENE</th>
                                <th>FEB</th>
                                <th>MAR</th>
                                <th>ABR</th>
                                <th>MAY</th>
                                <th>JUN</th>
                                <th>JUL</th>
                                <th>AGO</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="./js/consultar_grupos.js"></script>
    <script src="./js/auth.js"></script>
</body>
</html>
